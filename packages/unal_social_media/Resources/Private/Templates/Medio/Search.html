<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Default" />
<f:section name="content">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-select@1.14.0-beta2/dist/css/bootstrap-select.min.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap-select@1.14.0-beta2/dist/js/bootstrap-select.min.js"></script>
  <f:form name="search-form" action="" >
    <label>-- Filtrar por Dependencia --</label><f:form.select name="dependencia" class="selectpicker" id="dependencia" optionValueField="uid" optionLabelField="nombre" sortByOptionLabel="true" additionalAttributes="{data-live-search:'true', data-size: '5'}" options="{dependencia}" />
    <label>-- Filtrar por red social --</label><f:form.select name="medio" class="selectpicker" id="medio" options="{medio}" optionValueField="uid" optionLabelField="nombre" sortByOptionLabel="true"/>
    <label>-- Filtrar por Sede --</label> <f:form.select name="sede" class="selectpicker" id="sede" options="{sede}" optionValueField="uid" optionLabelField="nombre" sortByOptionLabel="true"/>
    

  </f:form>
  
  
  
  <!--<f:link.action pageUid="{createPid}" action="new" controller="Cuenta" >New Cuenta</f:link.action>-->
  
  
  
  <script>var $LangNoItems = 'No hay elementos';</script>
  <script src="{f:uri.resource(path:'js/fun.js')}" type="text/javascript" ></script>
  
</f:section>
</html>
