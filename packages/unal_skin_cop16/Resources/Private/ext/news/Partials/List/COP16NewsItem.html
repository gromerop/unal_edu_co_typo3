<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
	  xmlns:n="http://typo3.org/ns/GeorgRinger/News/ViewHelpers"
	  data-namespace-typo3-fluid="true">
	  
    <!-- ===== unal_skin_cop16/Partials/List/COP16NewsItem.html ===== -->

    <div class="article articletype-{newsItem.type}{f:if(condition: newsItem.istopnews, then: ' topnews')}" itemscope="itemscope" itemtype="http://schema.org/Article" data-bs-toggle="modal" data-bs-target="#eventModal">
	    <n:excludeDisplayedNews newsItem="{newsItem}"/>
	    
	    <f:if condition="{newsItem.mediaPreviews}">
		    <!-- media preview element -->
		    <f:then>
			    <f:if condition="{newsItem.teaser}">
				    <f:then>
					    <f:variable name="newsTeaser">{newsItem.teaser}</f:variable>
				    </f:then>
				    <f:else>
       					<f:variable name="newsTeaser"> </f:variable>
				    </f:else>
			    </f:if>
			    <div class="img-wrap">
                    <n:link newsItem="{newsItem}" settings="{settings}" title="{newsItem.title}">
					    <f:alias map="{mediaElement: newsItem.mediaPreviews.0}">
						    <f:if condition="{mediaElement.originalResource.type} == 2">
							    <f:image image="{mediaElement}" title="{mediaElement.originalResource.title}" alt="{mediaElement.originalResource.alternative}" maxWidth="{f:if(condition: settings.media.maxWidth, then: settings.media.maxWidth, else: settings.list.media.image.maxWidth)}" maxHeight="{f:if(condition: settings.media.maxHeight, then: settings.media.maxHeight, else: settings.list.media.image.maxHeight)}"/>
						    </f:if>
						    <f:if condition="{mediaElement.originalResource.type} == 4">
							    <f:render partial="Detail/MediaVideo" arguments="{mediaElement: mediaElement}"/>
						    </f:if>
						    <f:if condition="{mediaElement.originalResource.type} == 5">
							    <f:image image="{mediaElement}" title="{mediaElement.originalResource.title}" alt="{mediaElement.originalResource.alternative}" maxWidth="{f:if(condition: settings.media.maxWidth, then: settings.media.maxWidth, else: settings.list.media.image.maxWidth)}" maxHeight="{f:if(condition: settings.media.maxHeight, then: settings.media.maxHeight, else: settings.list.media.image.maxHeight)}"/>
						    </f:if>
					    </f:alias>
                    </n:link>
			    </div>
		    </f:then>
		    <f:else>
			    <f:if condition="{settings.displayDummyIfNoMedia}">
				    <div class="img-wrap">
					    <span class="no-media-element">
						    <n:link newsItem="{newsItem}" settings="{settings}" title="{newsItem.title}">
							    <f:image src="{settings.list.media.dummyImage}" title="" alt="" maxWidth="{f:if(condition: settings.media.maxWidth, then: settings.media.maxWidth, else: settings.list.media.image.maxWidth)}" maxHeight="{f:if(condition: settings.media.maxHeight, then: settings.media.maxHeight, else: settings.list.media.image.maxHeight)}"/>
						    </n:link>
					    </span>
				    </div>
			    </f:if>
		    </f:else>
	    </f:if>
	    
	    
	    <div class="news-info">
	        <!-- header -->
	        <div class="header">
		        <h3>
			        <n:link newsItem="{newsItem}" settings="{settings}" title="{newsItem.title}">
				        <span itemprop="headline"><f:format.html>{newsItem.title}</f:format.html></span>
			        </n:link>
		        </h3>
	        </div>
	        
	        <!-- body -->
          <div class="news-body">
              <h3>{newsItem.title}</h3>
              <n:renderMedia news="{newsItem}" imgClass="img-responsive" videoClass="video-wrapper" audioClass="audio-wrapper">
                  <div class="row">
                      <div class="col-xs-12 col-sm-12 col-md-8 col-lg-8">
                          <f:if condition="{newsItem.teaser}">
                              <!-- teaser -->
                              <div class="teaser-text" itemprop="description">
                                  <f:format.html>{newsItem.teaser}</f:format.html>
                              </div>
                          </f:if>

                          <f:if condition="{newsItem.contentElements}">
                          <!-- content elements -->
                          <f:cObject typoscriptObjectPath="lib.tx_news.contentElementRendering">{newsItem.contentElementIdList}</f:cObject>
                          </f:if>
                          <!-- main text -->
                          <div class="news-text-wrap" itemprop="articleBody">
                              <f:format.html>{newsItem.bodytext}</f:format.html>
                          </div>
                      </div>
                      <div class="col-xs-12 col-sm-12 col-md-4 col-lg-4">
                          <f:render partial="Detail/MediaContainer" arguments="{media: newsItem.mediaNonPreviews, settings:settings}" />
                      </div>
                  </div>
              </n:renderMedia>
          </div>

	        <!-- footer information -->
	        <div class="footer">
		        <p>
			        <!-- date -->
			        <span class="news-list-date">
				        <time itemprop="datePublished" datetime="{f:format.date(date:newsItem.datetime, format:'Y-m-d')}">
					        <f:format.date format="{f:translate(key:'dateFormat')}">{newsItem.datetime}</f:format.date>
				        </time>
			        </span>

			        <f:if condition="{newsItem.firstCategory}">
				        <!-- first category -->
				        <span class="news-list-category">{newsItem.firstCategory.title}</span>
			        </f:if>

			        <f:if condition="{newsItem.tags}">
				        <!-- Tags -->
				        <span class="news-list-tags" itemprop="keywords">
					        <f:for each="{newsItem.tags}" as="tag">
						        {tag.title}
					        </f:for>
				        </span>
			        </f:if>

			        <!-- author -->
			        <f:if condition="{newsItem.author}">
				        <span class="news-list-author">{newsItem.author}</span>
			        </f:if>
		        </p>
	        </div>
	    </div>
    </div>
</html>
