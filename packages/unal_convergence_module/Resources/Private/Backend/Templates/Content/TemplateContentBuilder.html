<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Default" />

<f:section name="content">
    <!-- loader -->
    <div id="cargando" style="background-color:rgb(0 0 0); height:100%; left: 0; opacity: 0.75; position: fixed; top: 0; width: 100%; z-index:9999; filter: alpha(opacity=75); -moz-opacity: .75; display:none;">
		<f:image src="EXT:unal_convergence_module/Resources/Public/Icons/loader.gif" width="34" height="34" style="position:absolute; top:0px; left:0px; bottom:0px; right:0px; margin:auto;"/>
	</div>

    <h1>Generador de plantillas de contenido</h1>

    <f:if condition="{templates}">
        <f:then>
            <f:be.infobox title="" state="-1">
                <f:link.action action="createContentTemplate" class="btn btn-primary">
                    Crear una nueva plantilla
                </f:link.action>
            </f:be.infobox>
        </f:then>
        <f:else>
            <f:be.infobox title="No se encontraron plantillas!" state="-1">
                <p>Actualmente no hay plantillas en el sistema.</p>
                <f:link.action action="createContentTemplate" class="btn btn-primary">
                    Crear una nueva plantilla
                </f:link.action>
            </f:be.infobox>
        </f:else>
    </f:if>

    <f:if condition="{templates}">
        <div class="row">
            <f:be.widget.paginate objects="{templates}" as="paginatedTemplates" configuration="{itemsPerPage: 50}">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th class="text-center" scope="col" width="50">#</th>
                            <th scope="col">Nombre</th>
                            <th scope="col">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                    <f:for each="{paginatedTemplates}" as="templateItem" iteration="iterator">
                        <tr>
                            <td class="text-center">{iterator.cycle}</td>
                            <td class="text-left">{templateItem.name}</td>
                            <td class="text-left">
                                <f:link.action action="editContentTemplate" arguments="{template: templateItem}" class="btn btn-primary"><i class="fa fa-edit"></i> Editar</f:link.action>
                                <f:link.action action="deleteTemplate" arguments="{template: templateItem, templateContent: 1}" class="btn btn-danger"><i class="fa fa-trash"></i> Eliminar</f:link.action>
                                <f:link.action action="duplicateTemplate" arguments="{template: templateItem, templateContent: 1}" class="btn btn-warning"><i class="fa fa-copy"></i> Duplicar</f:link.action>
                            </td>
                        </tr>
                    </f:for>
                    </tbody>
                </table>
            </f:be.widget.paginate>
        </div>
    </f:if>

</f:section>
