<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Default" />

<f:section name="content">

    <f:be.pageRenderer 
        includeJsFiles="{0:'{f:uri.resource(path: \'JavaScript/Backend/createContentTpl.js?1234567\')}'}" 
        includeCssFiles="{0:'{f:uri.resource(path: \'Css/Backend/createTpl.css?1234567\')}'}"
    
    ></f:be.pageRenderer>



    <!-- loader -->
    <div id="cargando" style="background-color:rgb(0 0 0); height:100%; left: 0; opacity: 0.75; position: fixed; top: 0; width: 100%; z-index:9999; filter: alpha(opacity=75); -moz-opacity: .75; display:none;">
		<f:image src="EXT:unal_convergence_module/Resources/Public/Icons/loader.gif" width="34" height="34" style="position:absolute; top:0px; left:0px; bottom:0px; right:0px; margin:auto;"/>
	</div>

    <f:link.action id="btn-home" action="templateContentBuilder" class="btn btn-small btn-primary pull-right">
        <i class="fa fa-home"></i> Volver
    </f:link.action>

    <h1>Crear una nueva plantilla de contenido</h1>

    <div class="container">
        <div class="row">
            <div class="col-xs-12">

                <f:form action="saveTemplate" id="tplForm" name="tplForm">
                    <div class="row">
                        <div class="col-sm-8">
                            <div class="form-group">
                                <label for="tplName">Nombre de la plantilla</label>
                                <f:form.textfield property="tplName" id="tplName" class="form-control" placeholder="Plantilla 1" />
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-xs-12">

                            <div class="form-group">
                                <label>Plantilla</label>
        
                                <div id="contenedor" class="panel panel-default">
                                    <div class="panel-heading">
                                        <div class="form-group panel-title">
                                            <label >Contenedor</label>
                                        </div>
                                    </div>
                                    <div class="panel-body">
                                        <div class="row">
                                            <div class="col-sm-12 controls">
                                                <button type="button" data-target="#contenedor" class="btn btn-success badge add-row"><i class="fa fa-plus"></i> Fila</button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
        
                            </div>

                        </div>
                    </div>

                    <button type="button" id="saveTpl" class="btn btn-default">Guardar plantilla</button>

                </f:form>

            </div>
        </div>
    </div>    


</f:section>
