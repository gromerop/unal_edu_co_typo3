<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">


<f:if condition="{row}">
    <div class="{row.customClass}">
        <f:if condition="{row.columns}">
            <f:for each="{row.columns}" as="column" iteration="iterator">
                <f:render partial="ViewHelpers/Widget/Column" arguments="{column: column, content:content}" />
            </f:for>
        </f:if>
    </div>
</f:if>

</html>
