<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<f:if condition="{teaser} && {content.teaser}">
    <div class="{teaser.customClass}">
        <f:if condition="{content.url}">
            <f:then>
                <f:link.external title="{content.title->f:format.stripTags()}" uri="{content.url}" target="_blank">{content.teaser}</f:link.external>
            </f:then>
            <f:else>
                {content.teaser}
            </f:else>
        </f:if>
    </div>
</f:if>

</html>
