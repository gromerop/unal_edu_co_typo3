<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">


<f:if condition="{column}">
    <div class="{column.customClass}">
        <f:if condition="{column.rows}">
            <f:for each="{column.rows}" as="row" iteration="iterator">
                <f:render partial="Content/Row" arguments="{row: row}" />
            </f:for>
        </f:if>
        <f:if condition="{column.contents}">
            <f:for each="{column.contents}" as="content" iteration="iterator">
                <f:render partial="Content/Content" arguments="{content: content}" />
            </f:for>
        </f:if>

    </div>
</f:if>

</html>
