<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
    <div class="mediaelement mediaelement-image" data-bs-toggle="modal" data-bs-target="#modal-video-{newsItem.uid}">
        <f:image image="{newsItem.falMedia.1}" title="{newsItem.falMedia.1.title}" alt="{newsItem.falMedia.1.alternative}" maxWidth="{f:if(condition: settings.media.maxWidth, then: settings.media.maxWidth, else: settings.detail.media.image.maxWidth)}" maxHeight="{f:if(condition: settings.media.maxHeight, then: settings.media.maxHeight, else: settings.detail.media.image.maxHeight)}" additionalAttributes="{itemprop:'image'}" />
    </div>
</html>
