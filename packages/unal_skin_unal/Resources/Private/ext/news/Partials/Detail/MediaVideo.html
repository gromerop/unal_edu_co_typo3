<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:v="http://typo3.org/ns/FluidTYPO3/Vhs/ViewHelpers"
      data-namespace-typo3-fluid="true">
    <div class="mediaelement mediaelement-image" data-bs-toggle="modal" data-bs-target="#modal-video-{newsItem.uid}">
        <f:image image="{newsItem.falMedia.1}" title="{newsItem.falMedia.1.title}" alt="{newsItem.falMedia.1.alternative}" maxWidth="{f:if(condition: settings.media.maxWidth, then: settings.media.maxWidth, else: settings.detail.media.image.maxWidth)}" maxHeight="{f:if(condition: settings.media.maxHeight, then: settings.media.maxHeight, else: settings.detail.media.image.maxHeight)}" additionalAttributes="{itemprop:'image'}" />
        <f:variable name="category_type" value="{newsItem.categories -> v:iterator.extract(key: 'slug')}" />
        <f:if condition="{v:iterator.indexOf(haystack: category_type, needle: 'sin-titulo-1' , considerKeys: 'TRUE')} < 0">
            <f:then>
                <div class="background-text" style="padding: 30px 22px 10px 25px;">
                    <button type="button" class="plyr__control plyr__control--overlaid" data-plyr="play" aria-label="Play" style="display: block; left: 30px;"><svg aria-hidden="true" focusable="false"><use xlink:href="#plyr-play"></use></svg><span class="plyr__sr-only">Play</span></button>
                    <h2 style="padding-left: 40px;"><f:format.raw>{newsItem.title}</f:format.raw></h2>
                    <f:format.raw>{newsItem.bodytext}</f:format.raw>
                </div>
            </f:then>
            <f:else></f:else>
        </f:if>
    </div>
</html>
