<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">


<f:if condition="{column}">

    <div class="{column.customClass}">
        <f:if condition="{column.rows}">
            <f:for each="{column.rows}" as="row" iteration="iterator">
                <f:render partial="ViewHelpers/Widget/Row" arguments="{row: row, content:content}" />
            </f:for>
        </f:if>

        <f:if condition="{column.media}">
            <f:for each="{column.media}" as="media" iteration="iterator">
                <f:render partial="ViewHelpers/Widget/Media" arguments="{media: media, content:content}" />
            </f:for>
        </f:if>
        <f:if condition="{column.title}">
            <f:for each="{column.title}" as="title" iteration="iterator">
                <f:render partial="ViewHelpers/Widget/Title" arguments="{title: title, content:content}" />
            </f:for>
        </f:if>
        <f:if condition="{column.teaser}">
            <f:for each="{column.teaser}" as="teaser" iteration="iterator">
                <f:render partial="ViewHelpers/Widget/Teaser" arguments="{teaser: teaser, content:content}" />
            </f:for>
        </f:if>
        <f:if condition="{column.fecha}">
            <f:for each="{column.fecha}" as="fecha" iteration="iterator">
                <f:render partial="ViewHelpers/Widget/Fecha" arguments="{fecha: fecha, content:content}" />
            </f:for>
        </f:if>
        <f:if condition="{column.logo}">
            <f:for each="{column.logo}" as="logo" iteration="iterator">
                <f:render partial="ViewHelpers/Widget/Logo" arguments="{logo: logo, content:content}" />
            </f:for>
        </f:if>

    </div>
</f:if>

</html>
