<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<f:if condition="{media}">
    <f:if condition="{content.url}">
        <f:then>
            <f:link.external uri="{content.url}" title="{content.title->f:format.stripTags()}" target="_blank"><img src="{content.imagen}" alt="{content.title->f:format.stripTags()}" title="{content.title->f:format.stripTags()}" class="{media.customClass}"></f:link.external>
        </f:then>
        <f:else>
            <img src="{content.imagen}" alt="{content.title->f:format.stripTags()}" title="{content.title->f:format.stripTags()}" class="{media.customClass}">
        </f:else>
    </f:if>
</f:if>

</html>
