{namespace vhs=FluidTYPO3\Vhs\ViewHelpers}
<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:if condition="{fecha} && {content.date}">
    <f:if condition="{vhs:condition.type.isString(value:content.date)} == ''">
        <f:then>
            <span class="c-day"><f:format.date format="d" >{content.date}</f:format.date></span>
            <span class="c-month"><f:format.date format="%B" >{content.date}</f:format.date></span>
        </f:then>
        <f:else>
            <div class="{fecha.customClass}">{content.date}</div>
        </f:else>
    </f:if>
</f:if>

</html>
