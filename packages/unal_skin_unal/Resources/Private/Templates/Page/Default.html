<f:layout name="DefaultUnal" />
<f:section name="Main">

<main class="home">
    <f:switch expression="{data.layout}">
        <f:case value="6">
            <div class="home_destacado {data.title->f:format.case(mode: 'lower')}">
                {home_destacado->f:format.raw()}
                <div class="home_content container">
                    {home_content->f:format.raw()}
                </div>
            </div>
        </f:case>
        <f:defaultCase>
            <div class="home_destacado">
                {home_destacado->f:format.raw()}
            </div>
            <div class="home_content container">
                {home_content->f:format.raw()}
            </div>
        </f:defaultCase>
    </f:switch>
    <div class="home_other">
        {home_other->f:format.raw()}
    </div>
</main>

</f:section>
